# This profile declares every permitted destination and action. The executor
# grants no additional permission. The operator assigns risk because the
# application determines which actions are irreversible. Risky actions
# require human approval on every run.
version: 6
profile_id: acme-cu/vendor-core-9.2/sandbox      # tenant and application variant
environment: sandbox                              # discovery requires a sandbox

base_url: https://sandbox.example.test
allow_routes:
  - /members
  - /members/:id
  - /members/:id/savings/**
deny_routes:
  - /members/:id/savings/wire                     # denial overrides permission
origins: []                                       # no additional origins are allowed
allow_new_windows: false
allow_downloads: false
# Form submissions require approval, whether triggered by a click or Enter.
# The browser identifies submissions from the form, not the model's label.
submissions: risky

# Each action type requires an explicit "any" permission. Effect rules can
# require approval or deny an operation, but cannot grant permission. The
# model names effects, so an effect name cannot authorize an action.
actions:
  observe:        {any: safe}
  read:           {any: safe}
  wait_for:       {any: safe}
  assert:         {any: safe}
  navigate:       {any: safe}
  scroll:         {any: safe}
  click:
    any: safe
    effects:
      submit_payment: risky
      close_account:  deny
  type:           {any: safe}
  select:         {any: safe}
  press_key:
    any: safe
    effects:
      submit_payment: risky
  dismiss_dialog: {any: safe}
  accept_dialog:  {any: risky}

perception:                                       # permitted observation methods
  allowed_modes:
    - structured                                  # accessible roles, names, and DOM context
    - visual                                      # a viewport screenshot
  max_alternate_observations_per_step: 1          # one alternate view before acting or asking for help

records:                                          # actions that require record evidence
  actions: [click, press_key]
  routes:
    - /members/:id/savings/**                     # every screen here shows one member's account

budgets:
  max_steps: 40
  max_wall_clock_s: 300
  max_retries_per_step: 2
  max_navigations: 15

secrets:
  login_password: {env: APP_PASSWORD}             # store the variable name, not its value

escalation:
  handoff_timeout_s: 900
  on_timeout: abort
