<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vendor Core 9.2 - Payments</title>
  <link rel="stylesheet" href="/static/core.css">
</head>
<body>
<h1>Payments</h1>

<section aria-label="Payment">
  <h2>Payment</h2>
  <dl><dt>Member number</dt><dd id="payee-number">10001</dd></dl>
  <form name="payment">
    <label for="amount">Amount</label>
    <input id="amount" name="amount" type="text" autocomplete="off">
    <label for="memo">Memo</label>
    <input id="memo" name="memo" type="text" autocomplete="off">
    <button type="submit" id="send-payment">Send payment</button>
    <input type="submit" id="save-draft" value="Save draft">
  </form>
  <p>Payments sent: <output id="payments-sent">none</output></p>
  <p>Drafts saved: <output id="drafts">0</output></p>
  <p>
    <button type="button" id="next-payee">Load the next payee</button>
    <button type="button" id="trap-focus">Send focus from the amount to the search</button>
    <button type="button" id="redraw-send">Redraw the send button</button>
    <button type="button" id="redraw-send-same">Redraw the send button unchanged</button>
    <button type="button" id="rebuild-form">Rebuild the payment form</button>
    <button type="button" id="rebuild-form-renamed">Rebuild the payment form renamed</button>
  </p>
</section>

<!-- A form the page submits with its own script. Its button is not a submit
     button, and it has two text fields, so Enter submits nothing natively;
     the page's key handler does it instead. -->
<section aria-label="Transfer">
  <h2>Transfer</h2>
  <form name="transfer">
    <label for="transfer-account">Transfer account</label>
    <input id="transfer-account" name="transfer_account" type="text" autocomplete="off">
    <label for="transfer-amount">Transfer amount</label>
    <input id="transfer-amount" name="transfer_amount" type="text" autocomplete="off">
    <button type="button" id="send-transfer">Send transfer</button>
  </form>
  <p>Transfers sent: <output id="transfers">0</output></p>
</section>

<section aria-label="Payee search">
  <h2>Payee search</h2>
  <form name="search">
    <label for="lookup">Find a payee</label>
    <input id="lookup" name="lookup" type="text" autocomplete="off">
  </form>
  <p>Searches: <output id="searches">0</output></p>
</section>

<script src="/static/payments.js"></script>
</body>
</html>
