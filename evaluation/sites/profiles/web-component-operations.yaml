# A single-page console built from custom web components. The profile names
# the pages an operator visits, restricted areas, outcomes that change data,
# submissions that change nothing, and a budget suited to the screens.
version: 8
profile_id: evaluation/web-component-operations/sandbox
environment: sandbox

base_url: http://127.0.0.1:4360
allow_routes:                 # one page; its screens change after the #
  - /
deny_routes:
  - /admin/**                 # administration is never part of servicing work
allow_new_windows: true       # permitted, and every new window still goes to a person
origins: []                   # no other address is reachable
allow_downloads: false        # statements and exports stay on the page
# Execute is a native submit button whose handler sends the command.
# Review is a separate preparation button.
submissions: risky

# Operator-reviewed operation aliases. They identify input but grant no action.
operations:
- name: shell
  operation: shell
  route: /
  frame: []
  mode: structured
  context:
  - heading:Operations portal
  kinds:
  - click
  - type
  - select
  - press_key
  target: '*'
  role: '*'
  key: ''
  submission: none
  limit: by_effect
- name: members
  operation: members
  route: /
  frame: []
  mode: structured
  context:
  - heading:Members
  kinds:
  - click
  - type
  - select
  - press_key
  target: '*'
  role: '*'
  key: ''
  submission: none
  limit: by_effect
- name: accounts
  operation: accounts
  route: /
  frame: []
  mode: structured
  context:
  - heading:Accounts
  kinds:
  - click
  - type
  - select
  - press_key
  target: '*'
  role: '*'
  key: ''
  submission: none
