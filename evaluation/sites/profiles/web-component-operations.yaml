- name: open_form
  operation: open_form
  route: /
  frame: []
  mode: structured
  context:
  - heading:Operations
  kinds:
  - click
  target: Open account
  role: button
  key: ''
  submission: none
  limit: by_effect
- name: prepare_account
  operation: prepare_account
  route: /
  frame: []
  mode: structured
  context:
  - heading:Open account
  kinds:
  - click
  - type
  - select
  target: '*'
  role: '*'
  key: ''
  submission: none
  limit: by_effect
- name: search_picker
  operation: search_picker
  route: /
  frame: []
  mode: structured
  context:
