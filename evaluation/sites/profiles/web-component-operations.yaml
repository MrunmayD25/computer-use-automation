pickers:
- operation: open_account
  slot: input|Member
  source: host
  property: ready
- operation: open_account
  slot: input|Product
  source: host
  property: ready

actions:
  observe:        {any: safe}
  read:           {any: safe}
  wait_for:       {any: safe}
  assert:         {any: safe}
  wait:           {any: safe}
  navigate:       {any: safe}
  scroll:         {any: safe}
  move:           {any: safe}
  click:
    any: safe
    effects:
      create_record:    risky
      update_record:    risky
      commit_change:    risky
      post_transaction: risky
      transfer_funds:   risky
      submit_payment:   risky
      approve_request:  risky
      deny_request:     risky
      request_approval: risky
      close_record:     risky
      remove_record:    deny
  double_click:
    any: safe
    effects:
      create_record:    risky
      update_record:    risky
      commit_change:    risky
      post_transaction: risky
      transfer_funds:   risky
      submit_payment:   risky
      approve_request:  risky
      deny_request:     risky
      request_approval: risky
      close_record:     risky
      remove_record:    deny
  drag:
    any: safe
    effects:
      create_record:    risky
      update_record:    risky
      commit_change:    risky
      post_transaction: risky
      transfer_funds:   risky
      submit_payment:   risky
      approve_request:  risky
      deny_request:     risky
      request_approval: risky
      close_record:     risky
      remove_record:    deny
  press_key:
    any: safe
    effects:
      create_record:    risky
      update_record:    risky
      commit_change:    risky
      post_transaction: risky
      transfer_funds:   risky
      submit_payment:   risky
      approve_request:  risky
      deny_request:     risky
      request_approval: risky
      close_record:     risky
      remove_record:    deny
  type:           {any: safe}
  select:         {any: safe}
  dismiss_dialog: {any: safe}
  accept_dialog:  {any: risky}  # a confirmation is where a change becomes final

perception:
  allowed_modes: [structured, visual]
  max_alternate_observations_per_step: 5

records:                      # no page layout is assumed, so no route is named
  actions: []
  routes: []

budgets:
  max_steps: 60               # opening an account takes about 32 steps
  max_wall_clock_s: 900       # automation time; waiting on a person is not counted
  max_retries_per_step: 4
  max_navigations: 30

secrets:
  approver_passcode: {env: APPROVER_PASSCODE}

escalation:
  handoff_timeout_s: 900
  on_timeout: abort

confirmation:                 # a second test record; confirms website text before a save
  inputs:
    member_id: NM000003       # a different name from the discovered member
    operator_id: OP0002
  outcomes:                   # inputs that make the application say no, one per answer
    record_not_found:         # a member the sandbox does not hold
      member_id: NM999998
    # Ineligible and permission-denied cases are not listed: their refusal
    # comes after a step the main capability never takes, so a discovery of
    # them cannot become a branch. A replay that meets one stops for a person.
