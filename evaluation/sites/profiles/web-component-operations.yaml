- name: execute_account
  operation: open_account
  route: /
  frame: []
  mode: structured
  context:
  - heading:Open account
  kinds:
  - click
  target: Execute
  role: button
  key: ''
  submission: native
  limit: risky
- name: execute_key
  operation: open_account
  route: /
  frame: []
  mode: structured
  context:
  - heading:Open account
  kinds:
  - press_key
  target: '*'
  role: '*'
  key: Enter
  submission: native
  limit: risky
- name: choose_picker
  operation: choose_picker
  route: /
  frame: []
  mode: structured
  context:
