  kinds:
  - click
  target: '*'
  role: option
  key: ''
  submission: none
  limit: by_effect
- name: choose_operator
  operation: choose_operator
  route: /
  frame: []
  mode: structured
  context:
  - popup:menu
  kinds:
  - click
  target: '*'
  role: menuitem
  key: ''
  submission: none
  limit: by_effect
- name: open_receipt
