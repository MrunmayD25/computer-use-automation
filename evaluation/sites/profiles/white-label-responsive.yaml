# A vendor's white-label portal with a responsive layout. The profile names
# the pages an operator visits, restricted areas, outcomes that change data,
# submissions that change nothing, and a budget suited to the screens.
version: 6
profile_id: evaluation/white-label-responsive/sandbox
environment: sandbox

base_url: http://127.0.0.1:4363
allow_routes:                 # the pages servicing work uses
  - /
  - /signon
  - /signout
  - /members
  - /member/:id
  - /accounts
  - /account/:id
  - /list/:name
  - /record/:kind/:id
  - /op/:kind
  - /op/:kind/select
  - /op/:kind/form
  - /op/:kind/review
  - /op/:kind/request-approval
  - /op/:kind/commit
  - /op/:kind/abandon
  - /op/:kind/result
  - /receipt/:number
  - /receipts
  - /static/**
deny_routes:
  - /admin/**                 # administration is never part of servicing work
allow_new_windows: true       # permitted, and every new window still goes to a person
origins: []                   # no other address is reachable
allow_downloads: false        # statements and exports stay on the page
# Signing on, searching, and filling in an operation change nothing. The
# review screen's submission commits it, so that one asks a person.
submissions:
  any: risky
  routes:
    /: by_effect
    /signon: by_effect
    /members: by_effect
    /accounts: by_effect
    /list/:name: by_effect
    /receipts: by_effect
    /op/:kind: by_effect
    /op/:kind/form: by_effect

actions:
  observe:        {any: safe}
  read:           {any: safe}
  wait_for:       {any: safe}
  assert:         {any: safe}
  wait:           {any: safe}
  navigate:       {any: safe}
  scroll:         {any: safe}
  move:           {any: safe}
  click:
    any: safe
    effects:
      create_record:    risky
      update_record:    risky
      commit_change:    risky
      post_transaction: risky
      transfer_funds:   risky
      submit_payment:   risky
      approve_request:  risky
      deny_request:     risky
      request_approval: risky
      close_record:     risky
      remove_record:    deny
  double_click:
    any: safe
    effects:
      create_record:    risky
      update_record:    risky
      commit_change:    risky
      post_transaction: risky
      transfer_funds:   risky
      submit_payment:   risky
      approve_request:  risky
      deny_request:     risky
      request_approval: risky
      close_record:     risky
      remove_record:    deny
  drag:
    any: safe
    effects:
      create_record:    risky
      update_record:    risky
      commit_change:    risky
      post_transaction: risky
      transfer_funds:   risky
      submit_payment:   risky
      approve_request:  risky
      deny_request:     risky
      request_approval: risky
      close_record:     risky
      remove_record:    deny
  press_key:
    any: safe
    effects:
      create_record:    risky
      update_record:    risky
      commit_change:    risky
      post_transaction: risky
      transfer_funds:   risky
      submit_payment:   risky
      approve_request:  risky
      deny_request:     risky
      request_approval: risky
      close_record:     risky
      remove_record:    deny
  type:           {any: safe}
  select:         {any: safe}
  dismiss_dialog: {any: safe}
  accept_dialog:  {any: risky}  # a confirmation is where a change becomes final

perception:
  allowed_modes: [structured, visual]
  max_alternate_observations_per_step: 5

records:                      # no page layout is assumed, so no route is named
  actions: []
  routes: []

budgets:
  max_steps: 60               # opening an account takes about 32 steps
  max_wall_clock_s: 900       # automation time; waiting on a person is not counted
  max_retries_per_step: 4
  max_navigations: 30

secrets:
  approver_passcode: {env: APPROVER_PASSCODE}

escalation:
  handoff_timeout_s: 900
  on_timeout: abort

confirmation:                 # a second test record; confirms website text before a save
  inputs:
    member_id: NM000003       # a different name from the discovered member
    operator_id: OP0002
  outcomes:                   # inputs that make the application say no, one per answer
    record_not_found:         # a member the sandbox does not hold
      member_id: NM999998
    # Ineligible and permission-denied cases are not listed: their refusal
    # comes after a step the main capability never takes, so a discovery of
    # them cannot become a branch. A replay that meets one stops for a person.
