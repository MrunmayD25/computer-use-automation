<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="435" viewBox="0 0 1500 435" role="img" aria-labelledby="title description">
  <title id="title">Computer-use automation architecture</title>
  <desc id="description">Three lanes show discovery, capability recording and approval, and replay. Setup supplies the goal, website, policy, and inputs to discovery. Verified steps become a draft capability, which a person reviews and approves before model-free replay returns outputs, a business outcome, or a typed failure. Discovery and replay share the browser adapter and human session control.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#8993a3"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .lane-title { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 19px; font-weight: 700; letter-spacing: 1.8px; fill: #343e52; }
      .lane-subtitle { font-size: 20px; fill: #717c90; }
      .category { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: .8px; }
      .card-title { font-size: 24px; font-weight: 700; fill: #263044; }
      .body { font-size: 22px; fill: #68758a; }
      .edge-label { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 17px; fill: #647086; }
      .edge { fill: none; stroke: #8993a3; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
      .shared-edge { fill: none; stroke: #8993a3; stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="435" fill="#ffffff"/>
  <text x="30" y="26" class="lane-title" >DISCOVERY</text>
  <text x="30" y="53" class="lane-subtitle" >Learn the workflow</text>
  <rect x="16" y="68" width="478" height="210" rx="14" fill="#eef0f5"/>
  <text x="524" y="26" class="lane-title" >CAPABILITY</text>
  <text x="524" y="53" class="lane-subtitle" >Record and approve</text>
  <rect x="510" y="68" width="478" height="210" rx="14" fill="#eef0f5"/>
  <text x="1018" y="26" class="lane-title" >REPLAY</text>
  <text x="1018" y="53" class="lane-subtitle" >Execute without a model</text>
  <rect x="1004" y="68" width="478" height="210" rx="14" fill="#eef0f5"/>
  <path class="edge" d="M 244 171 H 270"/>
  <path class="edge" d="M 480 171 H 524"/>
  <path class="edge" d="M 738 171 H 764"/>
  <path class="edge" d="M 974 171 H 1018"/>
  <path class="edge" d="M 1232 171 H 1258"/>
  <path class="shared-edge" d="M 375 260 V 318"/>
  <path class="shared-edge" d="M 1125 260 V 318"/>
  <g id="setup">
    <rect x="30" y="86" width="214" height="174" rx="10" fill="#ffffff" stroke="#dce1e9" stroke-width="1.5"/>
    <path d="M 34 90 V 256" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
  <text x="48" y="113" class="category" fill="#7c3aed">INPUTS</text>
  <text x="48" y="144" class="card-title" >1 · Set up</text>
  <text x="48" y="178" class="body" >Goal, website,</text>
  <text x="48" y="207" class="body" >and policy profile.</text>
  <text x="48" y="236" class="body" >Fill goal inputs.</text>
  </g>
  <g id="discovery">
    <rect x="270" y="86" width="210" height="174" rx="10" fill="#ffffff" stroke="#dce1e9" stroke-width="1.5"/>
    <path d="M 274 90 V 256" stroke="#3d55cf" stroke-width="6" stroke-linecap="round"/>
  <text x="288" y="113" class="category" fill="#3d55cf">MODEL-DRIVEN</text>
  <text x="288" y="144" class="card-title" >2 · Discover</text>
  <text x="288" y="178" class="body" >Observe; decide.</text>
  <text x="288" y="207" class="body" >Check policy.</text>
  <text x="288" y="236" class="body" >Act and verify.</text>
  </g>
  <g id="recorder">
    <rect x="524" y="86" width="214" height="174" rx="10" fill="#ffffff" stroke="#dce1e9" stroke-width="1.5"/>
    <path d="M 528 90 V 256" stroke="#66758b" stroke-width="6" stroke-linecap="round"/>
  <text x="542" y="113" class="category" fill="#66758b">ARTIFACT</text>
  <text x="542" y="144" class="card-title" >3 · Record</text>
  <text x="542" y="178" class="body" >Save steps and</text>
  <text x="542" y="207" class="body" >checks as a</text>
  <text x="542" y="236" class="body" >draft capability.</text>
  </g>
  <g id="approval">
    <rect x="764" y="86" width="210" height="174" rx="10" fill="#ffffff" stroke="#dce1e9" stroke-width="1.5"/>
    <path d="M 768 90 V 256" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
  <text x="782" y="113" class="category" fill="#7c3aed">HUMAN REVIEW</text>
  <text x="782" y="144" class="card-title" >4 · Approve</text>
  <text x="782" y="178" class="body" >Review the draft.</text>
  <text x="782" y="207" class="body" >Approve it</text>
  <text x="782" y="236" class="body" >for replay.</text>
  </g>
  <g id="replay">
    <rect x="1018" y="86" width="214" height="174" rx="10" fill="#ffffff" stroke="#dce1e9" stroke-width="1.5"/>
    <path d="M 1022 90 V 256" stroke="#3d55cf" stroke-width="6" stroke-linecap="round"/>
  <text x="1036" y="113" class="category" fill="#3d55cf">MODEL-FREE</text>
  <text x="1036" y="144" class="card-title" >5 · Replay</text>
  <text x="1036" y="178" class="body" >Follow saved</text>
  <text x="1036" y="207" class="body" >steps and checks.</text>
  <text x="1036" y="236" class="body" >No model calls.</text>
  </g>
  <g id="result">
    <rect x="1258" y="86" width="210" height="174" rx="10" fill="#ffffff" stroke="#dce1e9" stroke-width="1.5"/>
    <path d="M 1262 90 V 256" stroke="#28816d" stroke-width="6" stroke-linecap="round"/>
  <text x="1276" y="113" class="category" fill="#28816d">OUTCOME</text>
  <text x="1276" y="144" class="card-title" >6 · Result</text>
  <text x="1276" y="178" class="body" >Outputs, outcome,</text>
  <text x="1276" y="207" class="body" >or typed failure.</text>
  </g>
  <rect x="16" y="318" width="1466" height="100" rx="14" fill="#f2f3f7" stroke="#c8cedb" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="30" y="342" class="lane-title" >SHARED SESSION</text>
  <text x="266" y="342" class="lane-subtitle" >Used by discovery and replay</text>
  <g id="human-control">
    <rect x="30" y="354" width="708" height="52" rx="8" fill="#ffffff" stroke="#dce1e9" stroke-width="1.3"/>
    <path d="M 34 358 V 402" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <text x="48" y="376" class="card-title" style="font-size:22px">Human control · Person ↔ session ownership</text>
  <text x="48" y="398" class="body" style="font-size:20px">Pause, take over, approve once, and resume.</text>
  </g>
  <g id="browser-surface">
    <rect x="764" y="354" width="704" height="52" rx="8" fill="#ffffff" stroke="#dce1e9" stroke-width="1.3"/>
    <path d="M 768 358 V 402" stroke="#66758b" stroke-width="5" stroke-linecap="round"/>
  <text x="782" y="376" class="card-title" style="font-size:22px">Surface · Playwright over Chromium</text>
  <text x="782" y="398" class="body" style="font-size:20px">Structured observations, screenshots, and actions.</text>
  </g>
</svg>
