name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.8.14"
          enable-cache: false
      - name: Install Python from .python-version
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install Chromium for the browser tests
        run: uv run --locked playwright install --with-deps chromium
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked ty check
      - name: Test installed CLI
        run: uv run --locked pytest
      - name: Smoke test CLI help
        run: uv run --locked computeruse --help
